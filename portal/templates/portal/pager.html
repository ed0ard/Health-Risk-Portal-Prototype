{% load portal_ui %}{% if pager.has_other_pages %}<div class="pager">{% if pager.has_previous %}<a href="?p={{ pager.previous_page_number }}&amp;{% if page_query %}{{ page_query }}{% else %}kind={{ kind }}&amp;subject={{ subject|urlencode }}&amp;{{ log_query }}{% endif %}">{% t "Previous" "上一页" %}</a>{% endif %} {{ pager.number }} / {{ pager.paginator.num_pages }} {% if pager.has_next %}<a href="?p={{ pager.next_page_number }}&amp;{% if page_query %}{{ page_query }}{% else %}kind={{ kind }}&amp;subject={{ subject|urlencode }}&amp;{{ log_query }}{% endif %}">{% t "Next" "下一页" %}</a>{% endif %}</div>{% endif %}
