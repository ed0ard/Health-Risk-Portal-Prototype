<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="774px" preserveAspectRatio="none" style="width:1760px;height:774px;background:#FFFFFF;" version="1.1" viewBox="0 0 1760 774" width="1760px" zoomAndPan="magnify"><title>Record Values - Conceptual Types Encoded Inside JSON</title><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="379.6475" x="683.4307" y="23.1318">Record Values - Conceptual Types Encoded Inside JSON</text></g><!--class Record--><g class="entity" data-entity="Record" data-source-line="4" data-uid="ent0002" id="entity_Record"><rect fill="#F4F8FC" height="82.3945" style="stroke:#181818;stroke-width:0.5;" width="149.334" x="763.5" y="309.0986"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="45.1309" x="815.6016" y="327.2305">Record</text><line style="stroke:#181818;stroke-width:0.5;" x1="764.5" x2="911.834" y1="335.1973" y2="335.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="82.0996" x="769.5" y="352.3291">+kind : String</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="97.6514" x="769.5" y="368.4277">+values : JSON</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="137.334" x="769.5" y="384.5264">+form_version : String</text></g><!--class BaselineValues--><g class="entity" data-entity="BaselineValues" data-source-line="9" data-uid="ent0003" id="entity_BaselineValues"><rect fill="#F4F8FC" height="146.7891" style="stroke:#181818;stroke-width:0.5;" width="244.333" x="165" y="469.0986"/><text fill="#000000" font-family="Arial" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="73.9443" x="250.1943" y="487.2305">&#171;dataType&#187;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="96.5098" x="238.9116" y="503.3291">BaselineValues</text><line style="stroke:#181818;stroke-width:0.5;" x1="166" x2="408.333" y1="511.2959" y2="511.2959"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="138.9541" x="171" y="528.4277">+age : Integer {0..125}</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="232.333" x="171" y="544.5264">+gender : Integer {0=female, 1=male}</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="177.0713" x="171" y="560.625">+height : Real {100..270 cm}</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="167.7334" x="171" y="576.7236">+weight : Real {20..350 kg}</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="205.8643" x="171" y="592.8223">+smoking : Integer {0=no, 1=yes}</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="202.7607" x="171" y="608.9209">+drinking : Integer {0=no, 1=yes}</text></g><!--class BloodPressureValues--><g class="entity" data-entity="BloodPressureValues" data-source-line="17" data-uid="ent0004" id="entity_BloodPressureValues"><rect fill="#F4F8FC" height="98.4932" style="stroke:#181818;stroke-width:0.5;" width="239.6367" x="555" y="493.5986"/><text fill="#000000" font-family="Arial" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="73.9443" x="637.8462" y="511.7305">&#171;dataType&#187;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="134.6338" x="607.5015" y="527.8291">BloodPressureValues</text><line style="stroke:#181818;stroke-width:0.5;" x1="556" x2="793.6367" y1="535.7959" y2="535.7959"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="222.9541" x="561" y="552.9277">+systolic_bp : Real {40..300 mmHg}</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="227.6367" x="561" y="569.0264">+diastolic_bp : Real {30..200 mmHg}</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="221.4365" x="561" y="585.125">+hbp_family : Integer {0=no, 1=yes}</text></g><!--class MoodValues--><g class="entity" data-entity="MoodValues" data-source-line="22" data-uid="ent0005" id="entity_MoodValues"><rect fill="#F4F8FC" height="82.3945" style="stroke:#181818;stroke-width:0.5;" width="273.9326" x="866" y="501.5986"/><text fill="#000000" font-family="Arial" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="73.9443" x="965.9941" y="519.7305">&#171;dataType&#187;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="77.8271" x="964.0527" y="535.8291">MoodValues</text><line style="stroke:#181818;stroke-width:0.5;" x1="867" x2="1138.9326" y1="543.7959" y2="543.7959"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="261.9326" x="872" y="560.9277">+depre_question_1..9 : Integer {each 0..3}</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="138.1611" x="872" y="577.0264">+/total : Integer {0..27}</text></g><!--class SleepValues--><g class="entity" data-entity="SleepValues" data-source-line="26" data-uid="ent0006" id="entity_SleepValues"><rect fill="#F4F8FC" height="82.3945" style="stroke:#181818;stroke-width:0.5;" width="263.8086" x="1301" y="501.5986"/><text fill="#000000" font-family="Arial" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="73.9443" x="1395.9321" y="519.7305">&#171;dataType&#187;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="78.6133" x="1393.5977" y="535.8291">SleepValues</text><line style="stroke:#181818;stroke-width:0.5;" x1="1302" x2="1563.8086" y1="543.7959" y2="543.7959"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="251.8086" x="1307" y="560.9277">+psqi_question_1..7 : Integer {each 0..3}</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="138.1611" x="1307" y="577.0264">+/total : Integer {0..21}</text></g><!--class Field--><g class="entity" data-entity="Field" data-source-line="30" data-uid="ent0007" id="entity_Field"><rect fill="#F4F8FC" height="154.7891" style="stroke:#181818;stroke-width:0.5;" width="139.6133" x="925" y="44.0986"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="30.3447" x="979.6343" y="62.2305">Field</text><line style="stroke:#181818;stroke-width:0.5;" x1="926" x2="1063.6133" y1="70.1973" y2="70.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="78.2031" x="931" y="87.3291">+key : String</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="71.9893" x="931" y="103.4277">+en : String</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="71.2031" x="931" y="119.5264">+zh : String</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="83.2754" x="931" y="135.625">+lo : Real = 0</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="83.2754" x="931" y="151.7236">+hi : Real = 3</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="116.5596" x="931" y="167.8223">+step : String = "1"</text><line style="stroke:#181818;stroke-width:0.5;" x1="926" x2="1063.6133" y1="174.7891" y2="174.7891"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="127.6133" x="931" y="191.9209">+choices : Tuple = ()</text></g><g class="entity" data-entity="GMN13" data-source-line="45" data-uid="ent0014" id="entity_GMN13"><path d="M6,693.0986 L6,751.3945 A0,0 0 0 0 6,751.3945 L415.7324,751.3945 A0,0 0 0 0 415.7324,751.3945 L415.7324,703.0986 L405.7324,693.0986 L227.03,693.0986 L255.87,616.3086 L219.03,693.0986 L6,693.0986 A0,0 0 0 0 6,693.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><path d="M405.7324,693.0986 L405.7324,703.0986 L415.7324,703.0986 L405.7324,693.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="361.457" x="12" y="711.2305">Submission constraint: 11 &lt;= weight/(height/100)^2 &lt;= 75.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="361.0811" x="12" y="727.3291">Every numeric input must be finite and within field bounds.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="388.7324" x="12" y="743.4277">step="1" requires integral values; step="any" permits decimals.</text></g><g class="entity" data-entity="GMN16" data-source-line="50" data-uid="ent0017" id="entity_GMN16"><path d="M451.5,701.0986 L451.5,743.2959 A0,0 0 0 0 451.5,743.2959 L826.5947,743.2959 A0,0 0 0 0 826.5947,743.2959 L826.5947,711.0986 L816.5947,701.0986 L647.13,701.0986 L665.26,591.6286 L639.13,701.0986 L451.5,701.0986 A0,0 0 0 0 451.5,701.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><path d="M816.5947,701.0986 L816.5947,711.0986 L826.5947,711.0986 L816.5947,701.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="307.7676" x="457.5" y="719.2305">Submission constraint: systolic_bp &gt; diastolic_bp.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="354.0947" x="457.5" y="735.3291">Record date must not be later than the local current date.</text></g><g class="entity" data-entity="GMN19" data-source-line="54" data-uid="ent0020" id="entity_GMN19"><path d="M861.5,677.0986 L861.5,767.5918 A0,0 0 0 0 861.5,767.5918 L1288.6846,767.5918 A0,0 0 0 0 1288.6846,767.5918 L1288.6846,687.0986 L1278.6846,677.0986 L1061.09,677.0986 L1019.34,583.8786 L1053.09,677.0986 L861.5,677.0986 A0,0 0 0 0 861.5,677.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><path d="M1278.6846,677.0986 L1278.6846,687.0986 L1288.6846,687.0986 L1278.6846,677.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="305.0264" x="867.5" y="695.2305">Q1 low mood; Q2 loss of interest; Q3 low energy;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="285.5781" x="867.5" y="711.3291">Q4 sleep difficulty; Q5 appetite; Q6 self-worth;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="406.1846" x="867.5" y="727.4277">Q7 concentration; Q8 physical discomfort; Q9 self-harm thoughts.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="261.4883" x="867.5" y="743.5264">Bands: 0-4 low; 5-9 moderate; 10-27 high.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="340.4775" x="867.5" y="759.625">Latest Q9 &gt; 0 produces a separate follow-up message.</text></g><g class="entity" data-entity="GMN22" data-source-line="61" data-uid="ent0023" id="entity_GMN22"><path d="M1324,677.0986 L1324,767.5918 A0,0 0 0 0 1324,767.5918 L1753.5088,767.5918 A0,0 0 0 0 1753.5088,767.5918 L1753.5088,687.0986 L1743.5088,677.0986 L1516.63,677.0986 L1457.05,583.8786 L1508.63,677.0986 L1324,677.0986 A0,0 0 0 0 1324,677.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><path d="M1743.5088,677.0986 L1743.5088,687.0986 L1753.5088,687.0986 L1743.5088,677.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="308.1572" x="1330" y="695.2305">source: waking at night, early waking, medication,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="408.5088" x="1330" y="711.3291">daytime sleepiness, dissatisfaction, daytime impact, mood impact.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="378.1572" x="1330" y="727.4277">legacy: a different seven-item wording set, same JSON keys.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="312.0332" x="1330" y="743.5264">record_fields() chooses labels using form_version.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="315.916" x="1330" y="759.625">Training rejects mixed sleep versions (except hbp).</text></g><g class="entity" data-entity="GMN25" data-source-line="68" data-uid="ent0026" id="entity_GMN25"><path d="M947.5,313.0986 L947.5,387.4932 A0,0 0 0 0 947.5,387.4932 L1356.0771,387.4932 A0,0 0 0 0 1356.0771,387.4932 L1356.0771,323.0986 L1346.0771,313.0986 L1130.85,313.0986 L1048.15,199.2786 L1122.85,313.0986 L947.5,313.0986 A0,0 0 0 0 947.5,313.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><path d="M1346.0771,313.0986 L1346.0771,323.0986 L1356.0771,323.0986 L1346.0771,313.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="278.5781" x="953.5" y="331.2305">Frozen Python dataclass, not an ORM entity.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="329.9639" x="953.5" y="347.3291">The four value types are documentation abstractions:</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="387.5771" x="953.5" y="363.4277">no corresponding Python classes or separate database table