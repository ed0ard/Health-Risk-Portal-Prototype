<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="708px" preserveAspectRatio="none" style="width:1306px;height:708px;background:#FFFFFF;" version="1.1" viewBox="0 0 1306 708" width="1306px" zoomAndPan="magnify"><title>LoginAttempt - Derived Lockout State Machine</title><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="311.1377" x="490.8512" y="23.1318">LoginAttempt - Derived Lockout State Machine</text></g><g id="Absent"><rect fill="#F1F1F1" height="50" rx="9" ry="9" style="stroke:#181818;stroke-width:0.5;" width="114.9238" x="591.17" y="644.0986"/><line style="stroke:#181818;stroke-width:0.5;" x1="591.17" x2="706.0938" y1="670.1973" y2="670.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="94.9238" x="601.17" y="662.2305">No attempt row</text></g><g id="Available"><rect fill="#F1F1F1" height="84.3945" rx="9" ry="9" style="stroke:#181818;stroke-width:0.5;" width="389.6533" x="453.67" y="44.0986"/><line style="stroke:#181818;stroke-width:0.5;" x1="453.67" x2="843.3233" y1="86.2959" y2="86.2959"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="56.8135" x="592.6539" y="62.2305">Available</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="111.6855" x="592.6539" y="78.3291">locked_until = null</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="248.6367" x="458.67" y="104.4277">authenticate [success] / failures=0; save</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="369.6533" x="458.67" y="120.5264">authenticate [failure and failures+1 &lt; limit] / failures++; save</text></g><g id="Locked"><rect fill="#F1F1F1" height="68.2959" rx="9" ry="9" style="stroke:#181818;stroke-width:0.5;" width="458.498" x="137.67" y="317.0986"/><line style="stroke:#181818;stroke-width:0.5;" x1="137.67" x2="596.168" y1="359.2959" y2="359.2959"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="45.1445" x="309.1314" y="335.2305">Locked</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="115.5752" x="309.1314" y="351.3291">locked_until &gt; now</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="438.498" x="142.67" y="377.4277">login POST [now &lt; locked_until] / render retry-later; skip authentication</text></g><g id="Expired"><rect fill="#F1F1F1" height="52.1973" rx="9" ry="9" style="stroke:#181818;stroke-width:0.5;" width="206.0059" x="237.67" y="494.0986"/><line style="stroke:#181818;stroke-width:0.5;" x1="237.67" x2="443.6759" y1="536.2959" y2="536.2959"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="186.0059" x="247.67" y="512.2305">Expired, pending next attempt</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="123.751" x="247.67" y="528.3291">locked_until &lt;= now</text></g><ellipse cx="711.67" cy="520.0986" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="20" data-uid="ent0003" id="entity_GMN2"><path d="M141.67,649.0986 L141.67,689.3945 A9,9 0 0 0 150.67,698.3945 L531.1026,698.3945 A9,9 0 0 0 540.1026,689.3945 L540.1026,650.0986 L530.1026,640.0986 L344.67,640.0986 L340.67,546.3686 L336.67,640.0986 L150.67,640.0986 A9,9 0 0 0 141.67,649.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><path d="M530.1026,640.0986 L530.1026,645.5986 A4.5,4.5 0 0 0 534.6026,650.0986 L540.1026,650.0986 L530.1026,640.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="331.4814" x="147.67" y="658.2305">These states are derived from fields and current time,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="377.4326" x="147.67" y="674.3291">not stored enum values. Expiration has no background timer:</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="368.1289" x="147.67" y="690.4277">the next login request performs cleanup and authentication.</text></g><g class="entity" data-entity="GMN5" data-source-line="25" data-uid="ent0006" id="entity_GMN5"><path d="M702.17,315.0986 L702.17,387.5918 A9,9 0 0 0 711.17,396.5918 L1144.4991,396.5918 A9,9 0 0 0 1153.4991,387.5918 L1153.4991,316.0986 L1143.4991,306.0986 L884.65,306.0986 L692.26,128.1886 L876.65,306.0986 L711.17,306.0986 A9,9 0 0 0 702.17,315.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><path d="M1143.4991,306.0986 L1143.4991,311.5986 A4.5,4.5 0 0 0 1147.9991,316.0986 L1153.4991,316.0986 L1143.4991,306.0986" fill="#FFF9E8" style="stroke:#B49A55;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="420.2461" x="708.17" y="324.2305">Authentication result also depends on password and User.is_active.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="414.0254" x="708.17" y="340.3291">Account disable/enable is a separate User flag, not a lockout state.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="430.3291" x="708.17" y="356.4277">Unknown usernames are tracked too; successful login keeps the row.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="376.5439" x="708.17" y="372.5264">reset = administrator resets an ordinary member's password.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="230.6992" x="708.17" y="388.625">limit = current SiteOptions.login_limit.</text></g><!--link *start* to Absent--><g class="link" data-entity-1=".start." data-entity-2="Absent" data-source-line="8" data-uid="lnk3" id="link_.start._Absent"><path d="M708.17,529.7186 C701.7,545.6586 687.34,580.7586 674.67,610.0986 C669.85,621.2386 666.8461,628.0489 662.1661,638.4289" fill="none" id="*start*-to-Absent" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="659.7,643.8986,667.0457,637.3381,661.7551,639.3405,659.7527,634.0499,659.7,643.8986" style="stroke:#34495E;stroke-width:1;"/></g><!--link Absent to Available--><g class="link" data-entity-1="Absent" data-entity-2="Available" data-source-line="9" data-uid="lnk4" id="link_Absent_Available"><path d="M648.67,644.0386 C648.67,554.7586 648.67,247.7086 648.67,134.4186" fill="none" id="Absent-to-Available" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="648.67,128.4186,644.67,137.4186,648.67,133.4186,652.67,137.4186,648.67,128.4186" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="29.5791" x="688.9732" y="444.2305">login</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="718.5523" y="444.2305">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="38.1172" x="722.442" y="444.2305">POST</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="760.5592" y="444.2305">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="764.4488" y="444.2305">/</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="157.9717" x="649.67" y="460.3291">get_or_create(username)</text></g><!--link Available to Absent--><g class="link" data-entity-1="Available" data-entity-2="Absent" data-source-line="16" data-uid="lnk9" id="link_Available_Absent"><path d="M843.83,113.2186 C959.82,139.8886 1098.07,193.6786 1170.67,302.0986 C1299.84,494.9986 872.7591,616.1185 712.1091,654.0885" fill="none" id="Available-to-Absent" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="706.27,655.4686,715.9487,657.2912,711.1359,654.3186,714.1086,649.5057,706.27,655.4686" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="31.124" x="1177.67" y="444.2305">reset</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1208.794" y="444.2305">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1212.6837" y="444.2305">/</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1216.5733" y="444.2305">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="38.1445" x="1220.463" y="444.2305">delete</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="22.5586" x="1206.8595" y="460.3291">row</text></g><!--link Available to Locked--><g class="link" data-entity-1="Available" data-entity-2="Locked" data-source-line="12" data-uid="lnk5" id="link_Available_Locked"><path d="M458.89,128.2186 C444.47,136.4386 431.11,146.2886 419.67,158.0986 C377.79,201.3086 368.6072,268.4837 366.8572,310.9237" fill="none" id="Available-to-Locked" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="366.61,316.9186,370.9774,308.0911,366.816,311.9229,362.9842,307.7615,366.61,316.9186" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="76.2822" x="483.3111" y="172.2305">authenticate</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" text